<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FairShare - Login & Register</title>

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(90deg, #e2e2e2, #c9d6ff);
        }

        .container {
            position: relative;
            width: 850px;
            height: 550px;
            background: #fff;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
            margin: 20px;
            border-radius: 30px;
            overflow: hidden;
        }

        .frm-box {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            background: #fff;
            color: #333;
            padding: 40px;
            z-index: 1;
            transition: 0.6s ease-in-out 1.2s, visibility 0s 1s;
        }

        .container.active .frm-box {
            right: 50%;
        }

        .frm-box.register {
            visibility: hidden;
        }

        .container.active .frm-box.register {
            visibility: visible;
        }

        form {
            width: 100%;
        }

        .container h1 {
            font-size: 36px;
            margin: -10px 0;
        }

        .in-box {
            position: relative;
            margin: 30px 0;
        }

        .in-box input {
            width: 100%;
            padding: 13px 50px 13px 20px;
            background: #f2f2f2;
            border: none;
            outline: none;
            color: #333;
            font-size: 16px;
            border-radius: 8px;
            font-weight: 500;
        }

        .in-box input::placeholder {
            color: #666;
            font-weight: 400;
        }

        .in-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            color: #666;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .forgot-link {
            margin: -15px 0 15px;
        }

        .forgot-link a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            height: 48px;
            background: #1b5e4a;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background: #17513f;
        }

        .container p {
            margin: 15px 0;
            font-size: 15px;
            color: #666;
        }

        .toggle-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .toggle-box::before {
            content: '';
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: #1b5e4a;
            border-radius: 150px;
            z-index: 2;
            transition: 1.8s ease-in-out;
        }

        .container.active .toggle-box::before {
            left: 50%;
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            color: #fff;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            transition: 0.6s ease-in-out;
        }

        .toggle-panel.toggle-left {
            transition-delay: 1.2s;
            left: 0;
        }

        .container.active .toggle-panel.toggle-left {
            left: -50%;
            transition-delay: 0.6s;
        }

        .toggle-panel.toggle-right {
            transition-delay: 0.6s;
            right: -50%;
        }

        .container.active .toggle-panel.toggle-right {
            right: 0;
            transition-delay: 1.2s;
        }

        .toggle-panel p {
            margin-bottom: 20px;
        }

        .toggle-panel .btn {
            width: 160px;
            height: 48px;
            border: 2px solid #fff;
            background: transparent;
            box-shadow: none;
        }

        .toggle-panel .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @media screen and (max-width: 650px) {

            .container {
                height: calc(100vh - 40px);
            }

            .frm-box {
                width: 100%;
                height: 70%;
                bottom: 0;
            }

            .container.active .frm-box {
                right: 0;
                bottom: 30%;
            }

            .toggle-box::before {
                width: 100%;
                height: 300%;
                left: 0;
                top: -270%;
                border-radius: 20vw;
            }

            .container.active .toggle-box::before {
                left: 0;
                top: 70%;
            }

            .toggle-panel {
                width: 100%;
                height: 30%;
            }

            .toggle-panel.toggle-left {
                top: 0;
            }

            .container.active .toggle-panel.toggle-left {
                left: 0;
                top: -30%;
            }

            .toggle-panel.toggle-right {
                right: 0;
                bottom: -30%;
            }

            .container.active .toggle-panel.toggle-right {
                bottom: 0;
            }
        }

        @media screen and (max-width: 400px) {

            .frm-box {
                padding: 20px;
            }

            .toggle-panel h1 {
                font-size: 30px;
            }
        }

        /* ================= FIELD ERRORS ================= */

        .field-error {
            display: none;
            text-align: left;
            background: #fdf1e6;
            color: #c8641e;
            border: 1px solid #f0cfae;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            margin: -10px 0 15px;
        }

        .field-error.show {
            display: block;
        }

        /* ================= POPUP ================= */

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 25px;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
            text-align: center;
        }

        .popup h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .popup p {
            margin-bottom: 20px;
        }

        .popup .close-btn {
            background-color: #1b5e4a;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .popup .close-btn:hover {
            background-color: #17513f;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================= LOGIN FORM ================= -->

        <div class="frm-box login">

            <form id="loginForm" novalidate>

                <h1>Login</h1>

                <div class="in-box">
                    <input
                        type="email"
                        placeholder="Email"
                        name="email"
                        id="login-email"
                    >

                    <i class='bx bxs-user'></i>
                </div>

                <div class="in-box">
                    <input
                        type="password"
                        placeholder="Password"
                        name="password"
                        id="login-password"
                    >

                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="field-error" id="login-error"></div>

                <div class="forgot-link">
                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

        </div>


        <!-- ================= REGISTER FORM ================= -->

        <div class="frm-box register">

            <form id="registerForm" novalidate>

                <h1>Register</h1>

                <div class="in-box">
                    <input
                        type="text"
                        placeholder="Username"
                        name="username"
                        id="register-username"
                    >

                    <i class='bx bxs-user'></i>
                </div>

                <div class="in-box">
                    <input
                        type="email"
                        placeholder="Email"
                        name="email"
                        id="register-email"
                    >

                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="in-box">
                    <input
                        type="password"
                        placeholder="Password (min 6 characters)"
                        name="password"
                        id="register-password"
                        minlength="6"
                    >

                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="field-error" id="register-error"></div>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

        </div>


        <!-- ================= TOGGLE PANEL ================= -->

        <div class="toggle-box">

            <div class="toggle-panel toggle-left">

                <h2>Hello, Welcome!</h2>

                <p>Don't have an account?</p>

                <button type="button" class="btn register-btn">
                    Register
                </button>

            </div>


            <div class="toggle-panel toggle-right">

                <h2>Welcome Back!</h2>

                <p>Already have an account?</p>

                <button type="button" class="btn login-btn">
                    Login
                </button>

            </div>

        </div>

    </div>


    <!-- ================= POPUP ================= -->

    <div class="popup" id="popup">

        <h2>Message</h2>

        <p id="popup-message"></p>

        <button
            class="close-btn"
            onclick="closePopup()"
        >
            Close
        </button>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>
        "use strict";
        /* ==============================================================
           FairShare — Login & Register (Phase 1)

           Two DIFFERENT browser storages are used here on purpose:

           - localStorage("FairShare-users")  — the list of every
             registered account. This is durable: it survives closing
             the browser, because an account should still exist next
             time you visit.

           - sessionStorage("FairShare-session") — which account is
             CURRENTLY logged in, in THIS tab. This clears itself the
             moment the tab or browser closes — that's exactly what a
             "session" means, and it's why closing the tab logs you out
             without deleting your account or your groups.

           Only concepts from the Phase 1 syllabus are used: variables,
           loops (for, for...of), functions, arrays, objects, DOM,
           events, forms + validation, LocalStorage, SessionStorage,
           and basic ES6 (template literals, destructuring, default
           parameters). No classes, no Promises/async/fetch.
           ============================================================== */

        const USERS_KEY = "FairShare-users";     // localStorage: array of {id, username, email, secret}
        const SESSION_KEY = "FairShare-session"; // sessionStorage: id of the currently logged-in user
        // No site-wide counters are kept anywhere — nothing about how many
        // people use this site, or how often, is tracked or shown to anyone.

        const container = document.querySelector('.container');
        const registerBtn = document.querySelector('.register-btn');
        const loginBtn = document.querySelector('.login-btn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const popup = document.getElementById('popup');
        const popupMessage = document.getElementById('popup-message');

        // ---------------------------------------------------------------
        // Small helpers for reading/writing JSON. Notice both take a
        // `storageArea` argument — sometimes that's localStorage,
        // sometimes sessionStorage, depending on what's being saved.
        // ---------------------------------------------------------------
        function readJSON(storageArea, key, fallback) {
            try {
                const value = JSON.parse(storageArea.getItem(key));
                return value === null || value === undefined ? fallback : value;
            } catch (err) {
                return fallback;
            }
        }

        function writeJSON(storageArea, key, value) {
            storageArea.setItem(key, JSON.stringify(value));
        }

        function getUsers() {
            return readJSON(localStorage, USERS_KEY, []);
        }

        function saveUsers(users) {
            writeJSON(localStorage, USERS_KEY, users);
        }

        // Not real encryption — just a simple loop-based character shift so
        // passwords aren't sitting around as plain readable text. A real
        // app would hash passwords on a server; that's outside this course.
        function scramble(text) {
            let result = "";
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) + 7);
            }
            return result;
        }

        // ---------------------------------------------------------------
        // SHOW REGISTER / LOGIN (sliding panel toggle)
        // ---------------------------------------------------------------
        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });

        // ---------------------------------------------------------------
        // POPUP + inline field error helpers
        // ---------------------------------------------------------------
        function showPopup(message) {
            popupMessage.textContent = message;
            popup.style.display = 'block';
        }

        function closePopup() {
            popup.style.display = 'none';
        }

        function showFieldError(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.classList.add('show');
        }

        function clearFieldError(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ---------------------------------------------------------------
        // REGISTER — loop through the existing users array to check for a
        // duplicate email before adding the new one. Saved to localStorage
        // because an account needs to still be there next time you visit.
        // ---------------------------------------------------------------
        registerForm.addEventListener('submit', (event) => {
            event.preventDefault();
            clearFieldError('register-error');

            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim().toLowerCase();
            const password = document.getElementById('register-password').value;

            // ----- validation -----
            if (username.length < 2) {
                showFieldError('register-error', 'Username must be at least 2 characters.');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showFieldError('register-error', 'Enter a valid email address.');
                return;
            }
            if (password.length < 6) {
                showFieldError('register-error', 'Password must be at least 6 characters.');
                return;
            }

            const users = getUsers();

            // explicit for loop — look for an existing account with this email
            let alreadyExists = false;
            for (let i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    alreadyExists = true;
                    break;
                }
            }
            if (alreadyExists) {
                showFieldError('register-error', 'An account with this email already exists.');
                return;
            }

            // Build the new user object. A brand-new account gets NO groups,
            // NO expenses, nothing pre-filled — that data only ever gets
            // created by the person themselves once they're logged in.
            const newUser = {
                id: `u_${Date.now()}`,
                username: username,
                email: email,
                secret: scramble(password),
                createdAt: Date.now(),
            };

            users.push(newUser);   // array method: add to the end of the array
            saveUsers(users);

            showPopup("Registration successful! Redirecting you to login…");
            registerForm.reset();

            setTimeout(() => {
                closePopup();
                container.classList.remove('active');
            }, 1200);
        });

        // ---------------------------------------------------------------
        // LOGIN — for...of loop with break, checking each stored user in
        // turn until a matching email + password combination is found.
        // The session itself goes in sessionStorage, not localStorage.
        // ---------------------------------------------------------------
        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            clearFieldError('login-error');

            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showFieldError('login-error', 'Enter your email and password.');
                return;
            }

            const users = getUsers();
            const scrambledPassword = scramble(password);
            let matchedUser = null;

            for (const user of users) {
                if (user.email === email && user.secret === scrambledPassword) {
                    matchedUser = user;
                    break; // stop looping — we already found our match
                }
            }

            if (!matchedUser) {
                showFieldError('login-error', 'Incorrect email or password.');
                return;
            }

            // Session lives in sessionStorage: closing this tab ends it.
            sessionStorage.setItem(SESSION_KEY, matchedUser.id);

            showPopup(`Welcome back, ${matchedUser.username}!`);
            loginForm.reset();

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 800);
        });

        // ---------------------------------------------------------------
        // FORGOT PASSWORD — same for...of + break loop technique, reused
        // for a different lookup.
        // ---------------------------------------------------------------
        document.getElementById('forgotPassword').addEventListener('click', (event) => {
            event.preventDefault();

            const email = document.getElementById('login-email').value.trim().toLowerCase();
            if (!email) {
                showPopup("Type your email above first, then click Forgot Password.");
                return;
            }

            const users = getUsers();
            let found = null;
            for (const user of users) {
                if (user.email === email) {
                    found = user;
                    break;
                }
            }

            if (!found) {
                showPopup("No account found with that email.");
                return;
            }

            showPopup("Password reset isn't available in this demo yet — that would need a real backend, which comes in a later phase of this project.");
        });

        // ---------------------------------------------------------------
        // On load: if a session already exists in THIS tab, skip straight
        // to the dashboard instead of showing the login form again.
        // ---------------------------------------------------------------
        (function init() {
            const sessionId = sessionStorage.getItem(SESSION_KEY);
            if (sessionId) {
                const users = getUsers();
                for (const user of users) {
                    if (user.id === sessionId) {
                        window.location.href = "dashboard.html";
                        return;
                    }
                }
            }
        })();
    </script>

</body>

</html>
